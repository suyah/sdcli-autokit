defaults:
  driver_file: /u01/app/jtds-1.3.1.jar

  paths:
    project_root: /u01/data/sdcli-autokit/projects

  source:
    type: sqlserver
    bcp_tls_mode: optional

  target:
    type: oracle
    # For an mTLS Oracle target, uncomment wallet_dir and use the unzipped
    # customer wallet directory mounted inside the container.
    # wallet_dir: /u01/data/sdcli-autokit/wallets/Wallet_example

  offload_preferences:
    packet_size: 65535

  load_preferences:
    direct: true
    rows: 50000
    bindsize: 268435456
    readsize: 268435456

migration_repository:
  type: oracle
  name: repo
  conn: tcps://oracle-repository.example.internal:1522/example_repo_service?ssl_server_dn_match=yes

  repo_user:
    connection_name: migration_repo
    user: migrep
    password: "${MIGRATION_REPO_PASSWORD}"

  super_user:
    connection_name: super_migration
    user: admin
    password: "${MIGRATION_SUPER_PASSWORD}"

migrations:
  - name: example_migration
    source:
      conn: sqlserver.example.internal:1433:example_database
      user: migration_user
      password: "${SOURCE_PASSWORD}"
    target:
      conn: tcps://oracle-target.example.internal:1522/example_target_service?ssl_server_dn_match=yes
      user: admin
      password: "${TARGET_PASSWORD}"
      default_schema_password: "${MIGRATED_SCHEMA_PASSWORD}"
